<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Каталог</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0-alpha1/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body>
    <nav class="navbar navbar-expand-lg navbar-dark bg-dark sticky-top">
        <div class="container">
            <a class="navbar-brand" href="#">Каталог</a>
        </div>
    </nav>
    <div class="container mt-5">
        <section id="catalog" class="mb-5">
            <h2 class="mb-4">Каталог</h2>
            <div class="row">
                <div class="col-md-6">
                    <div class="card">
                        <div class="card-header bg-success text-white">
                            Код
                        </div>
                        <div class="card-body">
                            <ul class="list-group">
                                <li class="list-group-item">1,500</li>
                                <li class="list-group-item">1,400</li>
                                <li class="list-group-item">1,600</li>
                            </ul>
                        </div>
                    </div>
                </div>
                <div class="col-md-6">
                    <div class="card">
                        <div class="card-header bg-info text-white">
                            Сроки
                        </div>
                        <div class="card-body">
                            <ul class="list-group">
                                <li class="list-group-item">2024 год</li>
                                <li class="list-group-item">2025 год</li>
                                <li class="list-group-item">2026 год</li>
                            </ul>
                        </div>
                    </div>
                </div>
            </div>
            <div class="row mt-4">
                <div class="col-md-6">
                    <div class="card">
                        <div class="card-header bg-warning text-dark">
                            Сроки сдачи
                        </div>
                        <div class="card-body">
                            <ul class="list-group">
                                <li class="list-group-item">2024 год</li>
                                <li class="list-group-item">2025 год</li>
                                <li class="list-group-item">2026 год</li>
                            </ul>
                        </div>
                    </div>
                </div>
                <div class="col-md-6">
                    <div class="card">
                        <div class="card-header bg-danger text-white">
                            Сроки общего пользования
                        </div>
                        <div class="card-body">
                            <ul class="list-group">
                                <li class="list-group-item">2024 год</li>
                                <li class="list-group-item">2025 год</li>
                                <li class="list-group-item">2026 год</li>
                            </ul>
                        </div>
                    </div>
                </div>
            </div>
        </section>
    </div>
</body>
</html>
